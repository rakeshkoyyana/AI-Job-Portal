<!doctype html>
<html><head><meta charset="utf-8"><title>JobPilot settings</title>
<style>
  body { max-width: 560px; margin: 32px auto; font: 14px/1.5 system-ui, sans-serif; color: #1c1e21; padding: 0 16px; }
  label { display: block; margin: 14px 0 4px; font-weight: 600; }
  input { width: 100%; padding: 8px; border: 1px solid #ccd0d5; border-radius: 6px; font: inherit; box-sizing: border-box; }
  button { margin-top: 14px; border: 0; border-radius: 6px; padding: 8px 14px; background: #1b3a8a; color: #fff; font: inherit; cursor: pointer; }
  #status { margin-top: 12px; } .ok { color: #1f8a4c; } .err { color: #c0392b; } code { background: #f0f2f5; padding: 1px 5px; border-radius: 4px; }
</style></head>
<body>
<h2>JobPilot settings</h2>
<p>Start the local server with <code>python -m jobpilot api</code>. It prints an access token: paste it below.</p>
<label for="url">Server URL</label><input id="url" value="http://127.0.0.1:8765">
<label for="token">Access token</label><input id="token" type="password" placeholder="paste the token printed by the server">
<button id="save">Save &amp; test connection</button>
<div id="status"></div>
<script src="options.js"></script>
</body></html>
